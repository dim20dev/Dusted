<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>DUSTED™ — Portable Power</title>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #ffffff;
            --text: #111111;
            --secondary: #666666;
            --surface: #fafafa;
            --border: #e5e5e5;
            --radius: 0px; /* Arxon uses sharp or very minimal radius for premium look */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Smooth Transition Engine */
        .page { display: none; opacity: 0; transition: opacity 0.6s ease; }
        .page.active { display: block; opacity: 1; }

        /* Navigation - Minimalist */
        nav {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px);
            z-index: 9999; display: flex; justify-content: space-between;
            align-items: center; padding: 0 4%; border-bottom: 1px solid var(--border);
        }
        .logo { font-weight: 700; font-size: 1.1rem; text-decoration: none; color: var(--text); letter-spacing: 2px; text-transform: uppercase; }
        .nav-right { display: flex; gap: 30px; align-items: center; }
        .nav-right a { text-decoration: none; color: var(--text); font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Home Page - The "Arxon" Hero */
        .hero { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 5%; }
        .hero-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 3px; color: var(--secondary); margin-bottom: 20px; text-transform: uppercase; }
        .hero h1 { font-size: clamp(3rem, 10vw, 6rem); font-weight: 500; letter-spacing: -0.05em; line-height: 0.9; margin-bottom: 40px; }
        .hero-img { width: 100%; max-width: 900px; cursor: pointer; transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
        .hero-img:hover { transform: scale(1.02); }

        /* Product Page - Professional Layout */
        .product-grid { display: grid; grid-template-columns: 1fr 450px; min-height: 100vh; }
        .gallery { background: var(--surface); padding: 100px 5%; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .gallery img { width: 100%; max-width: 700px; display: block; }
        
        .product-info { padding: 120px 10% 60px 5%; border-left: 1px solid var(--border); background: white; }
        .p-sticky { position: sticky; top: 120px; }
        .p-title { font-size: 2.5rem; font-weight: 500; letter-spacing: -0.03em; margin-bottom: 10px; }
        .p-price { font-size: 1.2rem; color: var(--secondary); margin-bottom: 40px; }
        
        .buy-btn {
            display: block; width: 100%; background: var(--text); color: white;
            padding: 20px; text-align: center; text-decoration: none;
            font-size: 0.8rem; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; margin-bottom: 40px; transition: 0.3s;
        }
        .buy-btn:hover { opacity: 0.8; }

        /* Features List */
        .feature-item { border-top: 1px solid var(--border); padding: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        .feature-item span { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        /* Mobile Fixes */
        @media (max-width: 900px) {
            .product-grid { grid-template-columns: 1fr; }
            .product-info { border-left: none; padding: 40px 5%; }
            .hero h1 { font-size: 3.5rem; }
        }

        /* Loading Animation */
        .fade { animation: fadeIn 0.8s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo" onclick="show('home')">DUSTED</a>
        <div class="nav-right">
            <a href="#" onclick="show('product')">Shop</a>
            <a href="#contact">Contact</a>
        </div>
    </nav>

    <div id="home" class="page active">
        <section class="hero">
            <p class="hero-label">Available Now</p>
            <h1>Pure Power.<br>Pure Design.</h1>
            <div onclick="show('product')" style="cursor: pointer; margin-top: 40px;">
                <img src="https://images.unsplash.com/photo-1563227812-0ea4c22e6cc8?q=80&w=1200" class="hero-img">
                <p style="margin-top: 20px; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px;">Discover DUSTED™ Mini — $39.00</p>
            </div>
        </section>
    </div>

    <div id="product" class="page">
        <div class="product-grid">
            <div class="gallery">
                <img src="https://images.unsplash.com/photo-1563227812-0ea4c22e6cc8?q=80&w=1000">
                <img src="https://images.unsplash.com/photo-1520116467324-c1597239c20f?q=80&w=1000">
                <img src="https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=1000">
            </div>

            <div class="product-info">
                <div class="p-sticky">
                    <p class="hero-label">Handheld Series</p>
                    <h2 class="p-title">DUSTED™ Mini Vacuum</h2>
                    <p class="p-price">$39.00 USD <span style="text-decoration: line-through; margin-left: 10px; font-size: 0.9rem;">$79.00</span></p>
                    
                    <a href="https://buy.stripe.com/YOUR_LINK" class="buy-btn">Add to Cart</a>

                    <div class="feature-item">
                        <span>Suction Power</span>
                        <p style="font-size: 0.8rem; color: var(--secondary);">8000 Pa</p>
                    </div>
                    <div class="feature-item">
                        <span>Charge Type</span>
                        <p style="font-size: 0.8rem; color: var(--secondary);">USB-C Fast</p>
                    </div>
                    <div class="feature-item">
                        <span>Run Time</span>
                        <p style="font-size: 0.8rem; color: var(--secondary);">45 Minutes</p>
                    </div>
                    <div class="feature-item">
                        <span>Filter</span>
                        <p style="font-size: 0.8rem; color: var(--secondary);">Washable HEPA</p>
                    </div>

                    <div id="contact" style="margin-top: 60px;">
                        <p style="font-size: 0.7rem; font-weight: 700; margin-bottom: 20px; text-transform: uppercase;">Inquiries</p>
                        <form action="https://formspree.io/f/YOUR_ID" method="POST">
                            <input type="email" name="email" placeholder="YOUR EMAIL" style="width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid var(--border); font-size: 0.8rem; margin-bottom: 20px; outline: none;">
                            <button type="submit" style="background: none; border: none; font-size: 0.7rem; font-weight: 800; letter-spacing: 2px; cursor: pointer; text-transform: uppercase;">Send Message →</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // Arxon-Style Page Switcher
        function show(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => {
                p.classList.remove('active');
            });
            
            const activePage = document.getElementById(pageId);
            activePage.style.display = 'block';
            
            // Short delay for fade effect
            setTimeout(() => {
                activePage.classList.add('active');
            }, 10);

            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
